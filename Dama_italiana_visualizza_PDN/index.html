<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Visualizzatore Dama Italiana — con analisi</title>
<style>
  :root {
    --bg:        #d0e0f0;
    --panel:     #b8cfe0;
    --border:    #8aaac0;
    --accent:    #2060a0;
    --accent-h:  #1a4880;
    --text:      #1a2a3a;
    --muted:     #4a6a88;
    --radius:    8px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: Arial, Helvetica, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  header {
    width: 100%;
    background: var(--accent);
    padding: 12px 20px;
    text-align: center;
  }
  header h1 {
    font-size: clamp(1.1rem, 3.5vw, 1.6rem);
    font-weight: bold;
    color: #ffffff;
    letter-spacing: .02em;
  }
  header p {
    font-size: .8rem;
    color: #cce0ff;
    margin-top: 2px;
  }

  main {
    width: 100%;
    max-width: 920px;
    padding: 16px 14px 40px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  /* ── Input PDN ─────────────────────────────────────── */
  .pdn-card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 12px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .pdn-card label {
    font-size: .8rem;
    font-weight: bold;
    color: var(--accent);
  }

  /* ── Area PDN ──────────────────────────────────────── */
  #pdn-input {
    width: 100%;
    min-height: 120px;
    background: #ffffff;
    color: #111111;
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 8px 10px;
    font-family: 'Courier New', monospace;
    font-size: 13px;
    font-weight: bold;
    line-height: 1.6;
    resize: none;
  }
  #pdn-input::placeholder { color: #8aaacc; font-weight: normal; }
  #pdn-input:focus { outline: none; border-color: var(--accent); }

  /* div di sola lettura con annotazioni colorate */
  #pdn-display {
    width: 100%;
    background: #ffffff;
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 8px 10px;
    font-family: 'Courier New', monospace;
    font-size: 13px;
    font-weight: bold;
    line-height: 1.6;
    color: #111111;
    white-space: pre-wrap;
    word-break: break-word;
  }
  #pdn-display .ann { color: #cc0000; font-weight: bold; }

  .btn-row { display: flex; gap: 16px; flex-wrap: wrap; align-items: center; }

  button {
    cursor: pointer;
    font-family: Arial, sans-serif;
    font-size: 1rem;
    border-radius: 6px;
    border: 1px solid var(--border);
    padding: 12px 24px;
    font-weight: bold;
    transition: background .12s;
    user-select: none;
    -webkit-user-select: none;
    touch-action: manipulation;
  }
  button:active { opacity: .85; }
  button:disabled { opacity: .4; cursor: default; }

  .btn-primary {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent-h);
  }
  .btn-primary:hover:not(:disabled) { background: var(--accent-h); }
  .btn-secondary {
    background: #e0ecf8;
    color: var(--text);
  }
  .btn-secondary:hover:not(:disabled) { background: #c8ddf0; }

  #err {
    font-size: .82rem;
    color: #8b0000;
    background: #ffe0e0;
    border: 1px solid #cc8080;
    border-radius: 4px;
    padding: 5px 10px;
    display: none;
  }

  /* ── Debug bar: nascosta ───────────────────────────── */
  #dbg { display: none !important; }

  /* ── Viewer ────────────────────────────────────────── */
  #viewer { display: flex; flex-direction: row; gap: 16px; flex-wrap: wrap; align-items: flex-start; }
  #no-game { color: var(--muted); font-size: .9rem; font-style: italic; padding: 4px 0; }

  /* ── Board ─────────────────────────────────────────── */
  #board-wrap {
    flex: 0 0 auto;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
  }
  canvas {
    display: block;
    border: 2px solid #5a8aaa;
    max-width: 100%;
    height: auto;
  }
  #turn-indicator { display: none; }

  /* ── Info panel ────────────────────────────────────── */
  #info-panel {
    flex: 1;
    min-width: 200px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .meta-card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 10px 14px;
  }
  .meta-row { display: flex; gap: 20px; flex-wrap: wrap; }
  .meta-item b {
    display: block;
    font-size: .7rem;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 1px;
  }
  .meta-item span { font-size: .92rem; color: var(--text); font-weight: bold; }
  #m-result { color: var(--accent); }

  /* ── Nav controls ──────────────────────────────────── */
  .nav-card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 10px 14px;
    display: flex;
    flex-direction: column;
    gap: 28px;
  }
  .nav-btns { display: flex; gap: 10px; align-items: center; }
  .nav-btns button {
    background: #e0ecf8;
    color: var(--text);
    padding: 12px 20px;
    font-size: 1.4rem;
    font-weight: bold;
    border-color: var(--border);
    user-select: none;
    -webkit-user-select: none;
    touch-action: manipulation;
  }
  .nav-btns button:hover:not(:disabled) { background: #c8ddf0; }
  #progress {
    flex: 1;
    text-align: center;
    font-size: .85rem;
    color: var(--muted);
    font-weight: bold;
  }
  input[type=range] {
    width: 100%;
    accent-color: var(--accent);
    cursor: pointer;
  }

  /* ── Moves list ────────────────────────────────────── */
  .moves-card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 8px 10px;
    flex: 1;
  }
  .moves-card h3 {
    font-size: .72rem;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 6px;
    font-weight: bold;
  }
  #moves-list {
    overflow-y: auto;
    max-height: 280px;
    display: flex;
    flex-direction: column;
    gap: 1px;
  }
  .move-pair {
    display: flex;
    gap: 2px;
    align-items: baseline;
    padding: 2px 3px;
    border-radius: 3px;
  }
  .move-pair:hover { background: #c8ddf0; }
  .mn {
    font-size: .72rem;
    color: var(--muted);
    min-width: 26px;
    font-family: monospace;
    padding-top: 2px;
  }
  .mw, .mb {
    font-family: 'Courier New', monospace;
    font-size: .85rem;
    padding: 2px 7px;
    border-radius: 3px;
    cursor: pointer;
    min-width: 56px;
  }
  .mw:hover { background: #b8d0e8; }
  .mb:hover { background: #b8d0e8; }
  .mw.active { background: var(--accent); color: #fff; }
  .mb.active { background: #c03030; color: #fff; }


  /* ── Analisi: valutazione e suggerimento ───────────── */
  .an-card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 10px 14px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .an-card h3 { font-size:.72rem; text-transform:uppercase; color:var(--muted); font-weight:bold; letter-spacing:.06em; }
  #turn-row { font-size:.92rem; font-weight:bold; color:var(--muted); }
  #turn-val { color:var(--text); }
  #eval-row { font-size:1rem; font-weight:bold; color:var(--muted); }
  #eval-val { color:var(--text); font-size:1.25rem; transition:opacity .2s; }
  #effect-row { font-size:.88rem; color:var(--muted); min-height:1.2em; }
  #effect-row.warn { color:#a02020; font-weight:bold; }
  .an-btns { display:grid; grid-template-columns:1fr; gap:10px; }
  .btn-big { background:#e0ecf8; color:var(--text); font-size:1rem; font-weight:bold; padding:12px 10px; border-color:var(--border); }
  .btn-big:hover:not(:disabled) { background:#c8ddf0; }
  a.btn-big { display:block; text-align:center; text-decoration:none; border:1px solid var(--border); border-radius:6px; }
  #hint-msg { font-size:.9rem; font-weight:bold; color:var(--accent-h); min-height:1.3em; }

  /* ── Responsive ────────────────────────────────────── */
  @media (max-width: 560px) {
    #viewer { flex-direction: column; }
    #info-panel { min-width: unset; }
    #moves-list { max-height: 160px; }
  }
</style>
</head>
<body>

<header>
  <h1>♟ Visualizzatore di Dama Italiana</h1>
  <p>Incolla un file PDN per rivedere e analizzare la partita: valutazione e suggerimento del computer</p>
</header>

<main>

  <!-- ① Damiera + controlli: sempre in cima, subito visibili su mobile -->
  <div id="viewer">
    <div id="board-wrap">
      <canvas id="board"></canvas>
    </div>

    <div id="info-panel">
      <div id="no-game">Incolla un PDN in fondo e premi "Carica partita".</div>

      <div class="nav-card">
        <div class="nav-btns">
          <button id="btn-first" tabindex="-1" title="Inizio">&#x23EE;</button>
          <button id="btn-prev"  tabindex="-1" title="Mossa precedente">&#x25C0;</button>
          <span id="progress">0 / 0</span>
          <button id="btn-next"  tabindex="-1" title="Mossa successiva">&#x25B6;</button>
          <button id="btn-last"  tabindex="-1" title="Fine">&#x23ED;</button>
        </div>
        <input type="range" id="slider" min="0" max="0" value="0" oninput="goTo(+this.value)">
      </div>

      <div class="an-card">
        <h3>Analisi del computer</h3>
        <div id="turn-row">Muove: <span id="turn-val">—</span></div>
        <div id="eval-row">Valutazione: <span id="eval-val">—</span></div>
        <div id="effect-row"></div>
        <div class="an-btns">
          <button class="btn-big" id="btn-hint" tabindex="-1" disabled>&#x1F4A1; Suggerisci</button>
          <a class="btn-big" id="btn-help" href="Help.html" target="_blank" tabindex="-1">&#x2753; Help</a>
        </div>
        <div id="hint-msg"></div>
      </div>
    </div>
  </div>

  <!-- ② Debug bar -->
  <div id="dbg"></div>

  <!-- ③ Area PDN in fondo -->
  <div class="pdn-card">
    <label>Testo PDN della partita</label>
    <textarea id="pdn-input"
              spellcheck="false"
              placeholder='[Event "Partita amichevole"]&#10;[White "Rossi"]&#10;[Black "Neri"]&#10;[Result "1-0"]&#10;&#10;1. 11-15 22-18 2. 15x22 {annotazione} 25x18 ...'></textarea>
    <div id="pdn-display" style="display:none"></div>
    <div class="btn-row" style="margin-top:8px">
      <button class="btn-primary" tabindex="-1" onclick="loadPDN()">&#x25B6; Carica partita</button>
      <button class="btn-secondary" tabindex="-1" onclick="askReset()">&#x21BA; Azzera</button>
      <div id="err"></div>
    </div>
  </div>

</main>

<!-- Overlay conferma Azzera -->
<div id="overlay-confirm" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:100;align-items:center;justify-content:center;">
  <div style="background:#fff;border-radius:12px;padding:26px 28px;text-align:center;max-width:300px;width:88%;box-shadow:0 8px 32px rgba(0,0,0,.4);">
    <div style="font-size:1.2rem;font-weight:bold;margin-bottom:8px;">Azzerare la partita?</div>
    <div style="font-size:.9rem;color:#555;margin-bottom:18px;">Il PDN caricato andrà perso.</div>
    <div style="display:flex;gap:12px;justify-content:center;flex-wrap:wrap;">
      <button class="btn-primary" tabindex="-1" onclick="confirmReset()">✓ Sì, azzera</button>
      <button class="btn-secondary" tabindex="-1" onclick="closeConfirm()">✕ Annulla</button>
    </div>
  </div>
</div>

<script>
// <<AI-ENGINE-START>>
function aiEngineFactory(opt){
  const INF=1000000, MATE=100000, QLIM=8;
  // pesi della valutazione e interruttori della ricerca (opt serve solo ai test)
  const W=Object.assign({
    man:100, adv:3, cen:2, back:5, edge:-4, prot:0, king:200, kcen:2, diag:4,
    pvs:1, lmr:1, kill:1, advq:4, mob:3, trap:0, basePen:30, baseNear:30, baseNearPly:6
  }, opt||{});

  // ── geometria: indice 0..31 = casella PDN 1..32 ──
  const ROW=new Int8Array(32), COL=new Int8Array(32), IDX=new Int8Array(64).fill(-1), CEN=new Int8Array(32), DIAG=new Int8Array(32);
  for(let i=0;i<32;i++){
    const r=i>>2, p=i&3;
    ROW[i]=r; COL[i]=(r&1)===0?p*2:p*2+1;
    IDX[ROW[i]*8+COL[i]]=i;
  }
  for(let i=0;i<32;i++){
    const r=ROW[i], c=COL[i];
    CEN[i]=(c>=2&&c<=5)?((r>=2&&r<=5)?4:2):0;
    DIAG[i]=r===c?1:0;
  }
  const DR=[-1,-1,1,1], DC=[-1,1,-1,1];
  const NB=new Int8Array(128).fill(-1), JP=new Int8Array(128).fill(-1);
  for(let i=0;i<32;i++) for(let d=0;d<4;d++){
    const r1=ROW[i]+DR[d], c1=COL[i]+DC[d], r2=ROW[i]+2*DR[d], c2=COL[i]+2*DC[d];
    if(r1>=0&&r1<8&&c1>=0&&c1<8) NB[i*4+d]=IDX[r1*8+c1];
    if(r2>=0&&r2<8&&c2>=0&&c2<8) JP[i*4+d]=IDX[r2*8+c2];
  }
  const WD=[0,1], BD=[2,3], ALL=[0,1,2,3];

  // celle: 0 vuota, 1 pedina bianca, 2 dama bianca, -1 pedina nera, -2 dama nera
  // side: +1 bianchi, -1 neri

  // ── generazione mosse ──
  function capDFS(b,s,cur,king,path,capt,kc,out){
    const dirs=king?ALL:(s>0?WD:BD);
    for(let k=0;k<dirs.length;k++){
      const d=dirs[k];
      const m=NB[cur*4+d], l=JP[cur*4+d];
      if(m<0||l<0) continue;
      const v=b[m];
      if(v===0||v*s>0) continue;
      if(!king&&(v===2||v===-2)) continue;   // la pedina non prende la dama
      if(b[l]!==0) continue;
      b[m]=0; path.push(l); capt.push(m);
      const nk=kc+((v===2||v===-2)?1:0);
      const promo=!king&&(s>0?ROW[l]===0:ROW[l]===7);
      if(promo){
        out.push({path:path.slice(),capt:capt.slice(),kc:nk,byKing:false});   // promozione: la presa finisce
      } else {
        const before=out.length;
        capDFS(b,s,l,king,path,capt,nk,out);
        if(out.length===before) out.push({path:path.slice(),capt:capt.slice(),kc:nk,byKing:king});
      }
      path.pop(); capt.pop(); b[m]=v;
    }
  }

  function genMoves(b,s){
    const caps=[];
    for(let i=0;i<32;i++){
      const v=b[i];
      if(v===0||v*s<0) continue;
      const king=(v===2||v===-2);
      b[i]=0;
      capDFS(b,s,i,king,[i],[],0,caps);
      b[i]=v;
    }
    if(caps.length>0){
      let max=0;
      for(let i=0;i<caps.length;i++) if(caps[i].capt.length>max) max=caps[i].capt.length;
      let best=caps.filter(c=>c.capt.length===max);
      let mk=0;
      for(let i=0;i<best.length;i++) if(best[i].kc>mk) mk=best[i].kc;
      best=best.filter(c=>c.kc===mk);
      const fk=best.filter(c=>c.byKing);
      if(fk.length>0) best=fk;
      return {moves:best,cap:true};
    }
    const mv=[];
    for(let i=0;i<32;i++){
      const v=b[i];
      if(v===0||v*s<0) continue;
      const king=(v===2||v===-2);
      const dirs=king?ALL:(s>0?WD:BD);
      for(let k=0;k<dirs.length;k++){
        const t=NB[i*4+dirs[k]];
        if(t>=0&&b[t]===0) mv.push({path:[i,t],capt:[],kc:0,byKing:king});
      }
    }
    return {moves:mv,cap:false};
  }

  function applyMove(b,m){
    const c=b.slice();
    const from=m.path[0], to=m.path[m.path.length-1];
    let v=c[from];
    c[from]=0;
    for(let i=0;i<m.capt.length;i++) c[m.capt[i]]=0;
    if(v===1&&ROW[to]===0) v=2;
    else if(v===-1&&ROW[to]===7) v=-2;
    c[to]=v;
    return c;
  }

  // ── valutazione (dal punto di vista di s) ──
  function evaluate(b,s){
    let sc=0;
    for(let i=0;i<32;i++){
      const v=b[i];
      if(v===0) continue;
      const r=ROW[i], c=COL[i];
      let x;
      if(v===1||v===-1){
        const adv=v===1?(7-r):r;
        x=W.man+adv*W.adv+CEN[i]*W.cen;
        if(adv===0) x+=W.back;
        if(W.advq&&adv>=5) x+=(adv-4)*W.advq;
        if(c===0||c===7) x+=W.edge;
        if(W.prot){
          const d0=v===1?2:0;
          const n1=NB[i*4+d0], n2=NB[i*4+d0+1];
          if(n1<0||b[n1]!==0) x+=W.prot;
          if(n2<0||b[n2]!==0) x+=W.prot;
        }
      } else {
        x=W.king+CEN[i]*W.kcen+(DIAG[i]?W.diag:0);
      }
      sc+=v>0?x:-x;
    }
    if(W.mob){
      // mobilità: differenza di mosse semplici disponibili (solo posizioni senza prese)
      let mw=0,mb=0;
      for(let i=0;i<32;i++){
        const v=b[i];
        if(v===0) continue;
        const king=(v===2||v===-2);
        const dirs=king?ALL:(v>0?WD:BD);
        let n=0;
        for(let k=0;k<dirs.length;k++){ const t=NB[i*4+dirs[k]]; if(t>=0&&b[t]===0) n++; }
        if(v>0) mw+=n; else mb+=n;
      }
      sc+=(mw-mb)*W.mob;
    }
    return s>0?sc:-sc;
  }

  // ── hash di Zobrist + tabella di trasposizione ──
  const Z1=new Int32Array(160), Z2=new Int32Array(160);
  let seed=0x2545F491|0;
  function rnd(){ seed^=seed<<13; seed^=seed>>>17; seed^=seed<<5; return seed|0; }
  for(let i=0;i<160;i++){ Z1[i]=rnd(); Z2[i]=rnd(); }
  const S1=rnd(), S2=rnd();
  let H1=0, H2=0;
  function hash(b,s){
    let h1=0,h2=0;
    for(let i=0;i<32;i++){
      const v=b[i];
      if(v!==0){ const k=i*5+v+2; h1^=Z1[k]; h2^=Z2[k]; }
    }
    if(s<0){ h1^=S1; h2^=S2; }
    H1=h1; H2=h2;
  }
  const TTSIZE=1<<20, TTMASK=TTSIZE-1;
  let tkey=null, tdepth=null, tflag=null, tscore=null, tmove=null;
  function allocTT(){
    if(tkey) return;
    tkey=new Int32Array(TTSIZE); tdepth=new Int8Array(TTSIZE); tflag=new Uint8Array(TTSIZE);
    tscore=new Int32Array(TTSIZE); tmove=new Int16Array(TTSIZE);
  }
  function setPen(on){ if(on!==penOn){ penOn=on; if(tflag) tflag.fill(0); } }   // la tabella di trasposizione dipende dalla modalita'
  function toTT(sc,ply){ return sc>MATE-1000?sc+ply:(sc<-MATE+1000?sc-ply:sc); }
  function fromTT(sc,ply){ return sc>MATE-1000?sc-ply:(sc<-MATE+1000?sc+ply:sc); }


  // ── database dei finali (facoltativo, file libro-finali.js) ──
  // Contiene, per tutte le posizioni fino a 4 pezzi, esito esatto (vince/perde/patta) e distanza alla
  // conversione (presa o promozione) modulo DBM. Simbolo: 0 patta; 1..M vince (d=sym-1); M+1..2M perde (d=sym-1-M).
  const DBWIN=30000, DBWIN5=20000;
  let dbHits=0, DB=null, DB5=null, DBM=8, DBMAXP=4, DBCLS=null, DBC=null;
  function setDB(arr,mod,arr5){
    if(!arr){ DB=null; DB5=null; return; }
    DBM=mod||8; DBMAXP=arr5?5:4;
    const C=[]; for(let n=0;n<=32;n++){ C.push([1,0,0,0,0,0,0]); for(let k=1;k<=6;k++) C[n][k]= n===0?0:(C[n-1][k]+C[n-1][k-1]); }
    // C[n][k] costruito con Pascal: C[n][k]=C[n-1][k]+C[n-1][k-1]
    DBC=C; DBCLS=new Map(); let base=0, base5=0;
    for(let tot=2;tot<=DBMAXP;tot++) for(let men=0;men<=tot;men++)
      for(let bm=0;bm<=tot;bm++) for(let bk=0;bm+bk<=tot;bk++){
        const bp=bm+bk; if(bp<1) continue; const wp=tot-bp; if(wp<1) continue;
        for(let wm=0;wm<=wp;wm++){ const wk=wp-wm; if(bm+wm!==men) continue;
          if(bp<wp||(bp===wp&&bk<wk)) continue;
          const nbm=C[28][bm], nwm=C[28][wm], nbk=C[32][bk], nwk=C[32][wk];
          const size=nbm*nwm*nbk*nwk, nstm=(bm===wm&&bk===wk)?1:2;
          if(tot<=4){ DBCLS.set(bm*1000+bk*100+wm*10+wk,{base,size,nbm,nwm,nbk,nwk,p5:false}); base+=size*nstm; }
          else { DBCLS.set(bm*1000+bk*100+wm*10+wk,{base:base5,size,nbm,nwm,nbk,nwk,p5:true}); base5+=size*nstm; } }
      }
    if(base!==arr.length||(arr5&&Math.ceil(base5/4)!==arr5.length)){ DB=null; DB5=null; return; }   // file non coerente: non usato
    DB=arr; DB5=arr5||null;
  }
  // simbolo del database per (b,s) oppure -1 (fuori ambito). Da chiamare solo se chi muove non ha prese.
  function dbSym(b,s){
    let bm=0,bk=0,wm=0,wk=0;
    for(let i=0;i<32;i++){ const v=b[i]; if(v===0) continue; if(v===-1) bm++; else if(v===-2) bk++; else if(v===1) wm++; else wk++; }
    const tot=bm+bk+wm+wk;
    if(tot>DBMAXP||bm+bk===0||wm+wk===0) return -1;
    const bp=bm+bk, wp=wm+wk;
    let rev=false;
    if(wp>bp) rev=true; else if(wp===bp){ if(wk>bk) rev=true; else if(bm===wm&&bk===wk&&s>0) rev=true; }
    let c0=bm,c1=bk,c2=wm,c3=wk, ss=s;
    if(rev){ c0=wm;c1=wk;c2=bm;c3=bk; ss=-s; }
    const cl=DBCLS.get(c0*1000+c1*100+c2*10+c3); if(!cl) return -1;
    const C=DBC;
    let rbm=0,rwm=0,rbk=0,rwk=0,nbm=0,nwm=0,nbk=0,nwk=0;
    for(let j=0;j<32;j++){
      let v=rev?-b[31-j]:b[j];
      if(v===0) continue;
      if(v===-1){ if(j>27) return -1; rbm+=C[j][++nbm]; }
      else if(v===1){ if(j<4) return -1; rwm+=C[j-4][++nwm]; }
      else if(v===-2) rbk+=C[j][++nbk];
      else rwk+=C[j][++nwk];
    }
    const idx=((rbm*cl.nwm+rwm)*cl.nbk+rbk)*cl.nwk+rwk;
    const cell=cl.base+(ss<0?0:cl.size)+idx;
    if(cl.p5) return 100+((DB5[cell>>2]>>((cell&3)<<1))&3);   // 5 pezzi: solo esito (100 patta, 101 vince, 102 perde)
    return DB[cell];
  }
  // esito esatto per chi muove: 0 patta, 1 vince, 2 perde, -1 sconosciuto (risolve le prese forzate con una ricerca)
  function dbRes(b,s){
    const g=genMoves(b,s);
    if(g.moves.length===0) return 2;
    if(!g.cap){ const y=dbSym(b,s); if(y<0) return -1; return y>=100?y-100:(y===0?0:(y<=DBM?1:2)); }
    let anyL=false, allW=true;
    for(const m of g.moves){
      const r=dbRes(applyMove(b,m),-s);
      if(r<0) return -1;
      if(r===2) anyL=true;
      if(r!==1) allW=false;
    }
    return anyL?1:(allW?2:0);
  }
  // scelta alla radice quando la posizione e' nel database: {pick:mossa} oppure {moves:[...]} (mosse da cercare) oppure {}
  function dbRoot(b,s,moves){
    const rs=[];
    for(const m of moves){ const r=dbRes(applyMove(b,m),-s); if(r<0) return {}; rs.push(r); }
    const win=[]; for(let i=0;i<moves.length;i++) if(rs[i]===2) win.push(i);
    if(win.length){
      const conv=[], quiet=[];
      for(const i of win){
        const m=moves[i], nb=applyMove(b,m);
        const from=b[m.path[0]], to=nb[m.path[m.path.length-1]];
        const promo=from!==to&&(from===1||from===-1);
        const gc=genMoves(nb.slice(),-s);
        if(m.capt.length>0||promo||gc.cap) conv.push(m);
        else { const ys=dbSym(nb,-s); quiet.push({m,e:(ys>DBM&&ys<100)?ys-1-DBM:-1}); }
      }
      if(conv.length) return {pick:conv[0]};
      const y=dbSym(b,s);
      if(quiet.some(q=>q.e<0)||y>=100||y<0) return {moves:win.map(i=>moves[i])};   // 5 pezzi: niente distanza, la ricerca sceglie fra le sole mosse vincenti
      if(y>=1&&y<=DBM){
        const want=((y-1)-1+DBM*4)%DBM;
        for(const q of quiet) if(q.e%DBM===want) return {pick:q.m};
      }
      return {pick:quiet[0].m};
    }
    const dr=[]; for(let i=0;i<moves.length;i++) if(rs[i]===0) dr.push(moves[i]);
    if(dr.length>0&&dr.length<moves.length) return {moves:dr};
    return {};
  }

  // ── ricerca ──
  let nodes=0, abort=false, deadline=Infinity;
  let penOn=false;   // difesa della base attiva (non nella valutazione numerica ne' nel libro delle aperture)
  const hist=new Int32Array(1024);
  const killers=new Int16Array(256).fill(-1);

  function orderMoves(moves,ttMove,ply){
    const k1=W.kill?killers[ply*2]:-2, k2=W.kill?killers[ply*2+1]:-2;
    for(let i=0;i<moves.length;i++){
      const m=moves[i], p=m.path;
      const id=(p[0]<<5)|p[1];
      let k=hist[p[0]*32+p[p.length-1]];
      if(id===ttMove) k+=10000000;
      else if(id===k1) k+=900000;
      else if(id===k2) k+=800000;
      if(m.capt.length>0) k+=m.capt.length*1000+m.kc*500;
      m.k=k;
    }
    moves.sort((a,b)=>b.k-a.k);
  }

  function negamax(b,s,depth,alpha,beta,ply){
    if((++nodes&2047)===0&&Date.now()>deadline) abort=true;
    if(abort) return 0;
    const g=genMoves(b,s), moves=g.moves;
    if(moves.length===0) return -MATE+ply;
    if(DB!==null&&!g.cap){
      const y=dbSym(b,s);
      if(y>=100){ if(depth<=0){ dbHits++; return y===100?0:(y===101?DBWIN5-ply:-DBWIN5+ply); } }   // 5 pezzi: valore solo alle foglie, cosi' la ricerca cerca la conversione
      else if(y>=0){ dbHits++; return y===0?0:(y<=DBM?DBWIN-ply:-DBWIN+ply); }
    }
    if(depth<=0){
      if(!g.cap||depth<-QLIM) return evaluate(b,s);   // continua solo se c'è una presa forzata
    }
    let h1=0,h2=0,idx=0,ttMove=-1;
    const origAlpha=alpha, useTT=depth>0;
    if(useTT){
      hash(b,s); h1=H1; h2=H2; idx=h1&TTMASK;
      if(tflag[idx]!==0&&tkey[idx]===h2){
        ttMove=tmove[idx];
        if(tdepth[idx]>=depth){
          const sc=fromTT(tscore[idx],ply), fl=tflag[idx];
          if(fl===1) return sc;
          if(fl===2){ if(sc>alpha) alpha=sc; } else { if(sc<beta) beta=sc; }
          if(alpha>=beta) return sc;
        }
      }
    }
    orderMoves(moves,ttMove,ply);
    let best=-INF, bestId=-1, oppMen=-1;
    for(let i=0;i<moves.length;i++){
      const m=moves[i];
      const nb=applyMove(b,m);
      // difesa della base: ogni mossa di una pedina di base (29,30,31 Bianco; 2,3,4 Rosso) costa basePen, a qualunque profondita'
      let pm=0;
      if(penOn){
        const f=m.path[0];
        if(b[f]===s&&(s>0?(f>=28&&f<=30):(f>=1&&f<=3))){
          if(oppMen<0){ oppMen=0; for(let q=0;q<32;q++) if(b[q]===-s){ oppMen=1; break; } }
          if(oppMen===1) pm=W.basePen+(W.baseNear&&ply<=W.baseNearPly?Math.round(W.baseNear*(W.baseNearPly+1-ply)/W.baseNearPly):0);
        }
      }
      let sc;
      if(i===0||!W.pvs){
        sc=-negamax(nb,-s,depth-1,-beta-pm,-alpha-pm,ply+1)-pm;
      } else {
        const red=(W.lmr&&depth>=3&&i>=3&&!g.cap)?1:0;
        sc=-negamax(nb,-s,depth-1-red,-alpha-1-pm,-alpha-pm,ply+1)-pm;
        if(!abort&&sc>alpha&&red>0) sc=-negamax(nb,-s,depth-1,-alpha-1-pm,-alpha-pm,ply+1)-pm;
        if(!abort&&sc>alpha&&sc<beta) sc=-negamax(nb,-s,depth-1,-beta-pm,-alpha-pm,ply+1)-pm;
      }
      if(abort) return 0;
      if(sc>best){ best=sc; bestId=(m.path[0]<<5)|m.path[1]; }
      if(sc>alpha){
        alpha=sc;
        if(alpha>=beta){
          if(!g.cap){
            const p=m.path;
            hist[p[0]*32+p[p.length-1]]+=depth*depth;
            const id=(p[0]<<5)|p[1];
            if(killers[ply*2]!==id){ killers[ply*2+1]=killers[ply*2]; killers[ply*2]=id; }
          }
          break;
        }
      }
    }
    if(useTT){
      tkey[idx]=h2; tdepth[idx]=depth;
      tflag[idx]=best<=origAlpha?3:(best>=beta?2:1);
      tscore[idx]=toTT(best,ply); tmove[idx]=bestId;
    }
    return best;
  }

  function posKey(cells,s){
    let k=s>0?'w':'b';
    for(let i=0;i<32;i++) k+=String.fromCharCode(99+cells[i]);
    return k;
  }

  const LEVELS={
    1:{iter:true,time:5000,maxDepth:30},          // Medio (fino a 5 s)
    2:{iter:true,time:15000,maxDepth:40}          // Forte (fino a 15 s)
  };

  function shuffle(a){
    for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); const t=a[i]; a[i]=a[j]; a[j]=t; }
  }

  // o: {cells:[32], side:+1|-1, level:1..2, hist:[chiavi posizioni già viste], timeMs?, evalOnly?}
  function think(o){
    const t0=Date.now();
    const b=Int8Array.from(o.cells), s=o.side;
    const lv=LEVELS[o.level]||LEVELS[2];
    dbHits=0;
    let moves=genMoves(b,s).moves;
    if(moves.length===0) return {none:true};
    if(moves.length===1&&!o.evalOnly) return {path:moves[0].path.map(x=>x+1),score:0,depth:0,nodes:0,ms:0,forced:true};
    if(DB!==null&&!o.evalOnly){
      const r=dbRoot(b,s,moves);
      if(r.pick) return {path:r.pick.path.map(x=>x+1),score:DBWIN,depth:0,nodes:0,ms:Date.now()-t0,db:true,dbHits:1,stat:evaluate(b,s)};
      if(r.moves){ moves=r.moves; dbHits++; }
    }
    allocTT();
    setPen(W.basePen>0&&!o.evalOnly);
    hist.fill(0); killers.fill(-1);
    shuffle(moves);
    const seen={};
    (o.hist||[]).forEach(k=>{ seen[k]=(seen[k]||0)+1; });
    for(const m of moves) m.pen=15*(seen[posKey(applyMove(b,m),-s)]||0);   // piccolo malus alle ripetizioni
    // difesa della base: le pedine di base (29,30,31 per il Bianco; 2,3,4 per il Rosso) si muovono solo se la mossa
    // e' migliore delle alternative di almeno basePen centesimi di pedina (finche' l'avversario ha ancora pedine)
    if(W.basePen&&!o.evalOnly){
      let oppMen=false;
      for(let i=0;i<32;i++) if(b[i]===-s){ oppMen=true; break; }
      if(oppMen){
        const bs=s>0?[28,29,30]:[1,2,3];
        for(const m of moves) if(b[m.path[0]]===s&&bs.indexOf(m.path[0])>=0) m.pen+=W.basePen;
      }
    }
    nodes=0; abort=false;

    const time=o.timeMs||lv.time;
    let order=moves.slice(), best=order[0], bestScore=0, doneDepth=0;
    for(let depth=1;depth<=lv.maxDepth;depth++){
      abort=false;
      deadline=depth===1?Infinity:t0+time;
      let alpha=-INF, itBest=null, itScore=-INF;
      for(const m of order){
        const sc=-negamax(applyMove(b,m),-s,depth-1,-INF,-(alpha+m.pen),1)-m.pen;
        if(abort) break;
        if(sc>alpha){ alpha=sc; itBest=m; itScore=sc; }
      }
      if(abort&&depth>1) break;
      if(itBest){
        best=itBest; bestScore=itScore; doneDepth=depth;
        order=[best].concat(order.filter(x=>x!==best));
      }
      if(Math.abs(bestScore)>MATE-1000) break;
      if(Date.now()-t0>time*0.6) break;
    }
    return {path:best.path.map(x=>x+1),score:bestScore,depth:doneDepth,nodes,ms:Date.now()-t0,dbHits,stat:evaluate(b,s)};
  }

  // Classifica le mosse indicate in o.only ([da,a] in base 0) con ricerca a finestra piena: serve al libro delle aperture
  function rank(o){
    const t0=Date.now();
    const b=Int8Array.from(o.cells), s=o.side;
    let moves=genMoves(b,s).moves;
    if(o.only){
      const ok=new Set(o.only.map(p=>p[0]*32+p[1]));
      moves=moves.filter(m=>ok.has(m.path[0]*32+m.path[m.path.length-1]));
    }
    if(moves.length===0) return {none:true};
    if(moves.length===1) return {ranked:[{path:moves[0].path.map(x=>x+1),score:0}],depth:0,nodes:0,ms:0};
    allocTT(); setPen(false); hist.fill(0); killers.fill(-1);
    nodes=0; abort=false;
    const time=o.timeMs||3000;
    let ranked=moves.map(m=>({m,score:0})), doneDepth=0;
    for(let depth=1;depth<=16;depth++){
      abort=false; deadline=depth<=2?Infinity:t0+time;
      const cur=[];
      for(const r of ranked){
        const sc=-negamax(applyMove(b,r.m),-s,depth-1,-INF,INF,1);
        if(abort) break;
        cur.push({m:r.m,score:sc});
      }
      if(abort) break;
      cur.sort((x,y)=>y.score-x.score);
      ranked=cur; doneDepth=depth;
      if(Date.now()-t0>time*0.6) break;
    }
    return {ranked:ranked.map(r=>({path:r.m.path.map(x=>x+1),score:r.score})),depth:doneDepth,nodes,ms:Date.now()-t0};
  }

  function run(o){ return o.rank?rank(o):think(o); }

  return {think,rank,run,genMoves,applyMove,posKey,evaluate,setDB,dbRes};
}

<script>
// ═══════════════════════════════════════════════════════════
//  DAMA ITALIANA — logica damiera
//
//  8×8, pezzi sulle caselle SCURE = (r+c) % 2 === 0
//  Cantone (basso destra) = (7,7) → 7+7=14 pari → scuro ✓
//
//  Numerazione PDN (1..32):
//    Riga 0 pari:    scure a col 0,2,4,6  → sq 1,2,3,4
//    Riga 1 dispari: scure a col 1,3,5,7  → sq 5,6,7,8
//    ...
//    Riga 7 dispari: scure a col 1,3,5,7  → sq 29,30,31,32
//    Cantone = (7,7) → sq 32 ✓
//
//  Posizione iniziale:
//    Neri   sq  1-12  (righe 0-2, in alto)
//    Bianchi sq 21-32 (righe 5-7, in basso)
//
//  Promozione:
//    Bianchi → riga 0 (sq 1-4)
//    Neri    → riga 7 (sq 29-32)
// ═══════════════════════════════════════════════════════════

const N = 8;
const canvas = document.getElementById('board');
const ctx    = canvas.getContext('2d');

// Dimensione canvas adattiva
function boardSize() {
  const maxW = Math.min(window.innerWidth - 32, 480);
  return Math.max(240, maxW > 480 ? 360 : maxW);
}
function resizeCanvas() {
  const sz = boardSize();
  canvas.width  = sz;
  canvas.height = sz;
  // ridisegna la board corrente dopo il resize
  const board = states.length ? states[curStep] : makeInitBoard();
  drawBoard(board);
}
window.addEventListener('resize', resizeCanvas);

// Ridisegna ogni volta che la pagina torna visibile (es. dopo scroll su mobile)
document.addEventListener('visibilitychange', () => {
  const board = states.length ? states[curStep] : makeInitBoard();
  resizeCanvas();
  drawBoard(board);
});

function SQ() { return canvas.width / N; }

function isDark(r, c) { return (r + c) % 2 === 0; }

function sqToRC(sq) {
  const i   = sq - 1;
  const r   = Math.floor(i / 4);
  const pos = i % 4;
  const c   = (r % 2 === 0) ? pos * 2 : pos * 2 + 1;
  return { r, c };
}
function rcToSq(r, c) {
  if (r < 0 || r >= N || c < 0 || c >= N || !isDark(r, c)) return null;
  const pos = (r % 2 === 0) ? (c / 2) : ((c - 1) / 2);
  return r * 4 + pos + 1;
}

function makeInitBoard() {
  const b = new Array(64).fill(null);
  for (let sq = 1;  sq <= 12; sq++) { const {r,c} = sqToRC(sq); b[r*N+c] = {color:'black', king:false}; }
  for (let sq = 21; sq <= 32; sq++) { const {r,c} = sqToRC(sq); b[r*N+c] = {color:'white', king:false}; }
  return b;
}
function cloneBoard(b) { return b.map(p => p ? {...p} : null); }

// ── Parser FEN per posizioni intermedie ───────────────────────────────────
// Formato: "B:WK10,18:B02,K25"  oppure  "W:W21,22,23:BK5,6"
//   - Prima lettera (B/W): chi muove per primo
//   - W...: lista pezzi bianchi  (K davanti = dama, numero semplice = pedina)
//   - B...: lista pezzi neri
// Restituisce {board, firstColor} oppure null se FEN assente/non valido.
function parseFEN(fenStr) {
  if (!fenStr) return null;
  fenStr = fenStr.trim();

  // Chi muove per primo (prima lettera prima dei due punti)
  const firstColor = fenStr.toUpperCase().startsWith('W') ? 'white' : 'black';

  const b = new Array(64).fill(null);

  // Estrae il gruppo di pezzi dopo :W e dopo :B (case-insensitive)
  const wMatch = fenStr.match(/:W([^:B]*)/i);
  const bMatch = fenStr.match(/:B([^:W]*)/i);

  function placePieces(str, color) {
    if (!str) return;
    const tokens = str.split(/[\s,;]+/).filter(Boolean);
    for (const tok of tokens) {
      const isKing = tok.toUpperCase().startsWith('K');
      const sq = parseInt(isKing ? tok.slice(1) : tok, 10);
      if (isNaN(sq) || sq < 1 || sq > 32) continue;
      const {r, c} = sqToRC(sq);
      b[r*N+c] = {color, king: isKing};
    }
  }

  placePieces(wMatch ? wMatch[1] : null, 'white');
  placePieces(bMatch ? bMatch[1] : null, 'black');
  return {board: b, firstColor};
}

// ── Trova pezzo avversario lungo diagonale (per tappe esplicite) ──────────
function findCapturedOnSegment(b, ra, ca, rb, cb, myColor) {
  const dr = Math.sign(rb - ra), dc = Math.sign(cb - ca);
  let r = ra + dr, c = ca + dc;
  while (!(r === rb && c === cb)) {
    const p = b[r*N+c];
    if (p) {
      if (p.color !== myColor) return r*N+c;
      else return null;
    }
    r += dr; c += dc;
  }
  return null;
}

// ── DFS per ricostruire catture in forma compatta (es. 3x1) ──────────────
function reconstructCaptures(board, fromSq, targetSq, isKing, myColor) {
  const stack = [];
  const b0 = cloneBoard(board);
  const {r: r0, c: c0} = sqToRC(fromSq);
  b0[r0*N+c0] = null;
  stack.push({sq: fromSq, b: b0, captured: []});

  while (stack.length) {
    const {sq, b, captured} = stack.pop();
    const {r: cr, c: cc} = sqToRC(sq);
    const dirs = [[-1,-1],[-1,1],[1,-1],[1,1]];

    for (const [dr, dc] of dirs) {
      if (!isKing) {
        // pedina: salto esatto di 2
        const mr = cr+dr, mc = cc+dc;
        const lr = cr+2*dr, lc = cc+2*dc;
        if (lr<0||lr>=N||lc<0||lc>=N) continue;
        if (!isDark(mr,mc) || !isDark(lr,lc)) continue;
        const victim = b[mr*N+mc];
        if (!victim || victim.color === myColor) continue;
        if (b[lr*N+lc] !== null) continue;
        const nb = cloneBoard(b);
        nb[mr*N+mc] = null;
        const newCap = [...captured, mr*N+mc];
        const landSq = rcToSq(lr, lc);
        if (landSq === targetSq) return newCap;
        stack.push({sq: landSq, b: nb, captured: newCap});
      } else {
        // dama: vola sulla diagonale
        let r = cr+dr, c = cc+dc;
        let victimIdx = null;
        while (r >= 0 && r < N && c >= 0 && c < N) {
          if (!isDark(r, c)) { r += dr; c += dc; continue; }
          const p = b[r*N+c];
          if (p) {
            if (p.color === myColor) break;
            if (victimIdx !== null) break;
            victimIdx = r*N+c;
            r += dr; c += dc; continue;
          }
          if (victimIdx !== null) {
            const nb = cloneBoard(b);
            nb[victimIdx] = null;
            const newCap = [...captured, victimIdx];
            const landSq = rcToSq(r, c);
            if (landSq === targetSq) return newCap;
            stack.push({sq: landSq, b: nb, captured: newCap});
          }
          r += dr; c += dc;
        }
      }
    }
  }
  return null;
}

// ── Applica una mossa PDN alla board ─────────────────────────────────────
function applyMove(board, raw) {
  const b = cloneBoard(board);
  const isCapture = raw.includes('x');
  const sqs = raw.split(isCapture ? 'x' : '-').map(Number);
  if (sqs.some(isNaN) || sqs.length < 2) return b;

  const {r: r0, c: c0} = sqToRC(sqs[0]);
  const piece = b[r0*N+c0];
  if (!piece) { console.warn('Nessun pezzo in sq', sqs[0], 'mossa:', raw); return b; }

  if (!isCapture) {
    const {r: r1, c: c1} = sqToRC(sqs[1]);
    b[r1*N+c1] = piece;
    b[r0*N+c0] = null;
  } else {
    let capturedIdxs = [];
    const isSingleDirect = (s1, s2) => {
      const {r:ra,c:ca} = sqToRC(s1), {r:rb,c:cb} = sqToRC(s2);
      return Math.abs(rb-ra) === 2 && Math.abs(cb-ca) === 2;
    };
    const useExplicit = sqs.length > 2 ||
      (sqs.length === 2 && isSingleDirect(sqs[0], sqs[1]));

    if (useExplicit) {
      const tmp = cloneBoard(b);
      tmp[r0*N+c0] = null;
      for (let i = 0; i < sqs.length - 1; i++) {
        const {r:ra,c:ca} = sqToRC(sqs[i]);
        const {r:rb,c:cb} = sqToRC(sqs[i+1]);
        const idx = findCapturedOnSegment(tmp, ra, ca, rb, cb, piece.color);
        if (idx !== null) { capturedIdxs.push(idx); tmp[idx] = null; }
      }
    } else {
      const res = reconstructCaptures(b, sqs[0], sqs[1], piece.king, piece.color);
      if (res) capturedIdxs = res;
      else console.warn('Percorso non trovato per', raw);
    }

    const {r:rf,c:cf} = sqToRC(sqs[sqs.length-1]);
    b[rf*N+cf] = piece;
    b[r0*N+c0] = null;
    for (const idx of capturedIdxs) b[idx] = null;
  }

  // promozione
  const {r:rf,c:cf} = sqToRC(sqs[sqs.length-1]);
  const p = b[rf*N+cf];
  if (p) {
    if (p.color === 'white' && rf === 0) p.king = true;
    if (p.color === 'black' && rf === 7) p.king = true;
  }
  return b;
}

// ═══════════════════════════════════════════════════════════
//  Stato
// ═══════════════════════════════════════════════════════════
let allMoves = [], states = [], curStep = 0, tags = {}, fenData = null;
let hint = null;            // {step, path}: suggerimento mostrato sulla damiera
let hintBusy = false;

function buildStates() {
  const startBoard = fenData ? cloneBoard(fenData.board) : makeInitBoard();
  const s = [cloneBoard(startBoard)];
  let cur = cloneBoard(startBoard);
  for (const m of allMoves) { cur = applyMove(cur, m.raw); s.push(cloneBoard(cur)); }
  return s;
}


// ═══════════════════════════════════════════════════════════
//  Analisi: valutazione della posizione e suggerimento della mossa
//  (stesso motore del programma per giocare, senza database; 5 secondi per posizione)
// ═══════════════════════════════════════════════════════════
const AI_TIME = 5000;
const keyEngine = aiEngineFactory();      // serve solo per generare le mosse legali (la tabella di ricerca si alloca al primo uso)
let syncEngine = null, workerUrl = null, workerBroken = false;

function cellsFromBoard(b) {
  const cells = new Array(32);
  for (let sq = 1; sq <= 32; sq++) {
    const {r, c} = sqToRC(sq);
    const p = b[r*N+c];
    cells[sq-1] = p ? (p.color === 'white' ? (p.king ? 2 : 1) : (p.king ? -2 : -1)) : 0;
  }
  return cells;
}
// chi deve muovere nella posizione dopo "step" mosse (1 = Bianco, -1 = Rosso)
function sideAt(step) {
  if (step < allMoves.length) return allMoves[step].color === 'white' ? 1 : -1;
  if (allMoves.length) return allMoves[allMoves.length-1].color === 'white' ? -1 : 1;
  return (fenData && fenData.firstColor === 'black') ? -1 : 1;
}
function legalMovesAt(step) {
  return keyEngine.genMoves(Int8Array.from(cellsFromBoard(states[step])), sideAt(step)).moves;
}

function makeWorker() {
  if (workerBroken || typeof Worker === 'undefined') return null;
  try {
    if (!workerUrl) {
      const src = 'const E=(' + aiEngineFactory.toString() + ')();\n' +
                  'onmessage=function(e){postMessage(Object.assign({id:e.data.id},E.run(e.data)));};';
      workerUrl = URL.createObjectURL(new Blob([src], {type: 'text/javascript'}));
    }
    return new Worker(workerUrl);
  } catch (e) { workerBroken = true; return null; }
}
// Lancia il calcolo in background (o, se i Web Worker non funzionano, nella pagina con tempo ridotto).
// Restituisce un oggetto con cancel().
function askEngine(req, cb) {
  const w = makeWorker();
  let done = false, timer = null;
  const h = { cancel() { done = true; clearTimeout(timer); try { if (w) w.terminate(); } catch (e) {} } };
  function finish(r) { if (done) return; done = true; try { if (w) w.terminate(); } catch (e) {} cb(r); }
  function runSync() {
    timer = setTimeout(() => {
      if (done) return;
      if (!syncEngine) syncEngine = aiEngineFactory();
      finish(syncEngine.run(Object.assign({}, req, {timeMs: Math.min(req.timeMs || 1500, 1500)})));
    }, 30);
  }
  if (w) {
    w.onmessage = e => finish(e.data);
    w.onerror = ev => { if (ev && ev.preventDefault) ev.preventDefault(); try { w.terminate(); } catch (e) {} workerBroken = true; if (!done) runSync(); };
    w.postMessage(req);
  } else runSync();
  return h;
}

// ── Valutazione ──────────────────────────────────────────
// Numero dal punto di vista del Bianco, in pedine: +1,36 = vantaggio del Bianco, -0,82 = vantaggio del Rosso.
const evalCache = new Map();   // step -> {sw: valutazione in centesimi di pedina (Bianco), depth}
let evalToken = 0, evalTimer = null, evalHandle = null;

function fmt(x) { return (x > 0 ? '+' : '') + x.toFixed(2).replace('.', ','); }
function cancelEval() {
  evalToken++; clearTimeout(evalTimer);
  if (evalHandle) { evalHandle.cancel(); evalHandle = null; }
}
function staleEval() {
  document.getElementById('eval-val').style.opacity = '0.45';
}
function showEvalFor(step) {
  const ev = evalCache.get(step);
  const v = document.getElementById('eval-val');
  if (!ev) return;
  v.style.opacity = '1';
  if (ev.sw > 90000) v.textContent = 'vince il Bianco';
  else if (ev.sw < -90000) v.textContent = 'vince il Rosso';
  else v.textContent = fmt(Math.round(ev.sw) / 100);
  showEffect(step);
}
// Effetto dell'ultima mossa giocata: differenza di valutazione tra la posizione prima e dopo la mossa
function showEffect(step) {
  const el = document.getElementById('effect-row');
  el.className = ''; el.textContent = '';
  if (step < 1) return;
  const cur = evalCache.get(step), prev = evalCache.get(step - 1);
  if (!cur || !prev) { el.textContent = 'Per vedere l\'effetto della mossa, guarda anche la posizione precedente.'; return; }
  if (Math.abs(cur.sw) > 90000 || Math.abs(prev.sw) > 90000) return;
  const mover = allMoves[step-1].color;
  let d = (cur.sw - prev.sw) / 100;           // a favore del Bianco
  if (mover === 'black') d = -d;              // a favore di chi ha mosso
  const nome = mover === 'white' ? 'Bianco' : 'Rosso';
  const txt = 'Mossa ' + allMoves[step-1].raw + ' del ' + nome + ': ' + fmt(d) + ' per chi ha mosso';
  if (d <= -0.5) { el.className = 'warn'; el.textContent = '⚠ ' + txt + ' — possibile errore'; }
  else el.textContent = txt;
}
function scheduleEval() {
  cancelEval();
  if (!states.length || (!allMoves.length && !fenData)) return;
  staleEval();
  const step = curStep;
  if (evalCache.has(step)) { showEvalFor(step); return; }
  if (hintBusy) return;
  const side = sideAt(step);
  if (legalMovesAt(step).length === 0) {            // chi deve muovere ha perso
    evalCache.set(step, {sw: side > 0 ? -100000 : 100000, depth: 0});
    showEvalFor(step); return;
  }
  const id = evalToken, cells = cellsFromBoard(states[step]);
  evalTimer = setTimeout(() => {
    if (id !== evalToken) return;
    evalHandle = askEngine({id, cells, side, level: 1, hist: [], timeMs: AI_TIME, evalOnly: true}, r => {
      if (id !== evalToken) return;
      evalHandle = null;
      if (r && typeof r.score === 'number') {
        evalCache.set(step, {sw: r.score * side, depth: r.depth});
        showEvalFor(step);
      }
    });
  }, 250);
}

// ── Suggerimento ─────────────────────────────────────────
let hintToken = 0, hintHandle = null;
function setHintMsg(t) { document.getElementById('hint-msg').textContent = t || ''; }
function cancelHint() {
  hintToken++;
  if (hintHandle) { hintHandle.cancel(); hintHandle = null; }
  hintBusy = false;
  const b = document.getElementById('btn-hint');
  if (b && states.length) b.disabled = false;
}
function movePDN(m) { return m.path.map(x => x + 1).join(m.capt.length ? 'x' : '-'); }
function hintAction() {
  if (hintBusy || !states.length || (!allMoves.length && !fenData)) return;
  const step = curStep, side = sideAt(step);
  const moves = legalMovesAt(step);
  if (!moves.length) { setHintMsg('Posizione finale: chi deve muovere non ha mosse.'); return; }
  cancelEval();
  const id = ++hintToken;
  hintBusy = true; hint = null;
  document.getElementById('btn-hint').disabled = true;
  setHintMsg('Cerco la mossa migliore…');
  drawBoard(states[curStep]);
  const cells = cellsFromBoard(states[step]);
  hintHandle = askEngine({id, cells, side, level: 1, hist: [], timeMs: AI_TIME}, r => {
    if (id !== hintToken) return;
    hintHandle = null; hintBusy = false;
    document.getElementById('btn-hint').disabled = false;
    if (step !== curStep) { scheduleEval(); return; }
    if (!r || r.none) { setHintMsg('Nessuna mossa trovata.'); scheduleEval(); return; }
    const path = r.path;                                   // caselle 1..32
    hint = {step, path};
    const mv = moves.find(m => m.path.length === path.length && m.path.every((x, i) => x + 1 === path[i]));
    let txt = 'Suggerimento: ' + (mv ? movePDN(mv) : path.join('-'));
    if (r.depth) txt += ' · profondità ' + r.depth + ' semimosse';
    if (step < allMoves.length) {
      const pl = allMoves[step].raw.split(/[x-]/).map(Number);
      const same = pl[0] === path[0] && pl[pl.length-1] === path[path.length-1];
      txt += same ? ' · è la mossa giocata nella partita' : ' · nella partita fu giocata: ' + allMoves[step].raw;
    }
    setHintMsg(txt);
    drawBoard(states[curStep]);
    scheduleEval();
  });
}

// ═══════════════════════════════════════════════════════════
//  Disegno
// ═══════════════════════════════════════════════════════════
function drawBoard(state) {
  const sq = SQ();
  const sz = canvas.width;
  ctx.clearRect(0, 0, sz, sz);

  // caselle: verde scuro / beige chiaro, stile PlayOK
  for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {
    ctx.fillStyle = isDark(r, c) ? '#5a9a50' : '#e8e0c0';
    ctx.fillRect(c*sq, r*sq, sq, sq);
  }

  // evidenzia ultima mossa: casella di partenza e arrivo più chiara
  if (curStep > 0) {
    const raw = allMoves[curStep-1].raw;
    const pts = raw.split(/[x-]/).map(Number);
    [[pts[0], 'rgba(255,220,0,0.5)'], [pts[pts.length-1], 'rgba(255,220,0,0.5)']].forEach(([s, col]) => {
      const {r, c} = sqToRC(s);
      ctx.fillStyle = col;
      ctx.fillRect(c*sq, r*sq, sq, sq);
    });
  }

  // suggerimento: caselle del percorso della mossa consigliata
  if (hint && hint.step === curStep) {
    for (const s2 of hint.path) {
      const {r, c} = sqToRC(s2);
      ctx.fillStyle = 'rgba(255,140,0,0.5)';
      ctx.fillRect(c*sq, r*sq, sq, sq);
    }
  }

  // numeri caselle scure — giallo chiaro semitrasparente, leggibile ma non invadente
  ctx.textBaseline = 'top';
  ctx.textAlign    = 'left';
  ctx.font = `bold ${Math.round(sq * 0.22)}px Arial`;
  for (let s = 1; s <= 32; s++) {
    const {r, c} = sqToRC(s);
    const x = c*sq + 3, y = r*sq + 2;
    ctx.strokeStyle = 'rgba(0,40,0,0.5)';
    ctx.lineWidth = 2;
    ctx.strokeText(s, x, y);
    ctx.fillStyle = 'rgba(255,255,200,0.75)';
    ctx.fillText(s, x, y);
  }

  // pezzi stile PlayOK: disco pieno + bordo scuro + cerchio interno bianco
  for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {
    const p = state[r*N+c]; if (!p) continue;
    const cx = c*sq + sq/2, cy = r*sq + sq/2, rad = sq * 0.40;
    const isWhite = p.color === 'white';

    // disco principale
    ctx.beginPath(); ctx.arc(cx, cy, rad, 0, Math.PI*2);
    ctx.fillStyle = isWhite ? '#f0f0f0' : '#cc2020';
    ctx.fill();

    // bordo esterno scuro
    ctx.strokeStyle = isWhite ? '#808080' : '#7a0000';
    ctx.lineWidth = Math.max(1.5, sq * 0.04);
    ctx.stroke();

    // dama: disco pieno al centro
    if (p.king) {
      ctx.beginPath(); ctx.arc(cx, cy, rad * 0.38, 0, Math.PI*2);
      ctx.fillStyle = isWhite ? '#505050' : '#ffeeee';
      ctx.fill();
    }
  }

  // freccia del suggerimento (sopra i pezzi, come nel programma per giocare)
  if (hint && hint.step === curStep && hint.path.length > 1) {
    ctx.strokeStyle = 'rgba(255,120,0,0.92)';
    ctx.lineWidth = Math.max(3, sq * 0.09);
    ctx.lineJoin = 'round'; ctx.lineCap = 'round';
    ctx.beginPath();
    hint.path.forEach((s2, i) => {
      const {r, c} = sqToRC(s2);
      const x = c*sq + sq/2, y = r*sq + sq/2;
      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    });
    ctx.stroke();
    const e = sqToRC(hint.path[hint.path.length-1]);
    ctx.beginPath(); ctx.arc(e.c*sq + sq/2, e.r*sq + sq/2, sq*0.16, 0, Math.PI*2);
    ctx.fillStyle = 'rgba(255,120,0,0.95)'; ctx.fill();
  }

  // bordo damiera
  ctx.strokeStyle = '#3a7030';
  ctx.lineWidth = 2;
  ctx.strokeRect(1, 1, sz - 2, sz - 2);
}

// ═══════════════════════════════════════════════════════════
//  UI
// ═══════════════════════════════════════════════════════════
function updateUI() {
  if (!states.length) return;
  drawBoard(states[curStep]);
  document.getElementById('progress').textContent = `${curStep} / ${allMoves.length}`;
  document.getElementById('slider').value = curStep;
  document.getElementById('btn-prev').disabled  = curStep <= 0;
  document.getElementById('btn-first').disabled = curStep <= 0;
  document.getElementById('btn-next').disabled  = curStep >= allMoves.length;
  document.getElementById('btn-last').disabled  = curStep >= allMoves.length;
  document.getElementById('btn-hint').disabled  = hintBusy;
  const sd = sideAt(curStep);
  document.getElementById('turn-val').textContent = sd > 0 ? 'Bianco' : 'Rosso';
}

// ── Suono mossa (Web Audio API, nessun file esterno) ─────────────────────
let audioCtx = null;
function playMoveSound() {
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    // "click" secco: oscillatore a 900Hz, durata 60ms
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.type = 'square';
    osc.frequency.setValueAtTime(900, audioCtx.currentTime);
    gain.gain.setValueAtTime(0.18, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.06);
    osc.start(audioCtx.currentTime);
    osc.stop(audioCtx.currentTime + 0.06);
  } catch(e) { /* silenzioso se audio non disponibile */ }
}

function goTo(n) {
  const prev = curStep;
  curStep = Math.max(0, Math.min(allMoves.length, +n));
  if (curStep !== prev) { playMoveSound(); cancelHint(); hint = null; setHintMsg(''); }
  updateUI();
  if (curStep !== prev) scheduleEval();
}
function stepBy(d) { goTo(curStep + d); }

// ── Bottoni navigazione: preventDefault impedisce il focus/scroll ─────────
// Usiamo pointerdown invece di click così funziona bene anche su touch
function wireNavBtn(id, action) {
  const btn = document.getElementById(id);
  btn.addEventListener('pointerdown', e => {
    e.preventDefault();
    e.stopPropagation();
  });
  btn.addEventListener('click', e => {
    e.preventDefault();
    e.stopPropagation();
    keepAwakeStart();
    action();
  });
}

// tasti freccia
document.addEventListener('keydown', e => {
  if (!allMoves.length) return;
  if (e.key === 'ArrowRight' || e.key === 'ArrowDown')  { stepBy(1);  e.preventDefault(); }
  if (e.key === 'ArrowLeft'  || e.key === 'ArrowUp')    { stepBy(-1); e.preventDefault(); }
  if (e.key === 'Home') { goTo(0);               e.preventDefault(); }
  if (e.key === 'End')  { goTo(allMoves.length); e.preventDefault(); }
});

// Collegamento bottoni (dopo che il DOM è pronto)
document.addEventListener('DOMContentLoaded', () => {
  wireNavBtn('btn-first', () => goTo(0));
  wireNavBtn('btn-prev',  () => stepBy(-1));
  wireNavBtn('btn-next',  () => stepBy(1));
  wireNavBtn('btn-last',  () => goTo(allMoves.length));
  wireNavBtn('btn-hint',  hintAction);

  // Slider: stopPropagation evita interferenze col touch della pagina
  const slider = document.getElementById('slider');
  slider.addEventListener('touchstart', e => e.stopPropagation(), {passive: true});
});

// ═══════════════════════════════════════════════════════════
//  Parser PDN
// ═══════════════════════════════════════════════════════════
function parsePDN(text, firstColor) {
  tags = {};
  const tagRe = /\[(\w+)\s+"([^"]*)"\]/g;
  let m;
  while ((m = tagRe.exec(text)) !== null) tags[m[1]] = m[2];
  let body = text
    .replace(/\[[^\]]*\]/g, '')
    .replace(/\{[^}]*\}/g,  ' ')
    .replace(/;[^\n]*/g,    ' ')
    .replace(/\b(1-0|0-1|1\/2-1\/2|\*)\b/g, ' ')
    .trim();
  const tokenRe = /(\d+\.+)|(\d+(?:[x-]\d+)+)/g;
  const tokens = [];
  let mt;
  while ((mt = tokenRe.exec(body)) !== null) {
    if (mt[1]) tokens.push({type:'num'});
    else if (mt[2]) tokens.push({type:'move', val:mt[2]});
  }
  const hms = [];
  // Se FEN indica che muovono i neri per primi, partiamo da black
  let white = (firstColor !== 'black');
  for (const tok of tokens) {
    if (tok.type === 'num') white = (firstColor !== 'black'); // reset al primo colore ad ogni numero di mossa
    else { hms.push({raw: tok.val, color: white ? 'white' : 'black'}); white = !white; }
  }
  return hms;
}

function buildMovesList() {
  const ml = document.getElementById('moves-list');
  ml.innerHTML = '';
  for (let i = 0; i < allMoves.length; i += 2) {
    const row = document.createElement('div'); row.className = 'move-pair';
    const mn  = document.createElement('span'); mn.className = 'mn';
    mn.textContent = `${Math.floor(i/2)+1}.`; row.appendChild(mn);
    const ws  = document.createElement('span'); ws.className = 'mw';
    ws.textContent = allMoves[i].raw; ws.onclick = () => goTo(i+1); row.appendChild(ws);
    if (allMoves[i+1]) {
      const bs = document.createElement('span'); bs.className = 'mb';
      bs.textContent = allMoves[i+1].raw; bs.onclick = () => goTo(i+2); row.appendChild(bs);
    }
    ml.appendChild(row);
  }
}

function showErr(msg) {
  const e = document.getElementById('err');
  e.textContent = msg; e.style.display = msg ? 'block' : 'none';
}

// Legge il testo puro dalla textarea
function getPDNText() {
  return document.getElementById('pdn-input').value || '';
}

// Mostra il testo PDN nel div di lettura con annotazioni in rosso
function showPDNDisplay(text) {
  const div = document.getElementById('pdn-display');
  const html = text
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/\{([^}]*)\}/g, '<span class="ann">{$1}</span>');
  div.innerHTML = html;
  div.style.display = 'block';
  document.getElementById('pdn-input').style.display = 'none';
}

// ═══════════════════════════════════════════════════════════
//  Load / Reset
// ═══════════════════════════════════════════════════════════
function loadPDN() {
  showErr('');
  const text = getPDNText().trim();
  if (!text) { showErr('Incolla un file PDN prima di caricare.'); return; }
  try {
    const tagRe2 = /\[(\w+)\s+"([^"]*)"\]/g;
    const tmpTags = {};
    let m2;
    while ((m2 = tagRe2.exec(text)) !== null) tmpTags[m2[1]] = m2[2];

    fenData = parseFEN(tmpTags['FEN'] || tmpTags['Setup'] || null);
    const firstColor = fenData ? fenData.firstColor : 'white';

    allMoves = parsePDN(text, firstColor);

    if (!allMoves.length && !fenData) {
      showErr('Nessuna mossa trovata. Verifica il formato PDN.'); return;
    }

    const dbg = document.getElementById('dbg');
    dbg.style.display = 'block';
    const fenInfo = fenData ? ` | FEN: ${tmpTags['FEN'] || tmpTags['Setup']}` : '';
    dbg.textContent = 'Mosse (' + allMoves.length + '): ' + allMoves.map(m => m.raw).join(' ') + fenInfo;

    states  = buildStates();
    curStep = 0;

    document.getElementById('slider').max = allMoves.length;
    document.getElementById('no-game').style.display = 'none';

    showPDNDisplay(text);
    evalCache.clear(); cancelHint(); hint = null; setHintMsg('');
    updateUI();
    scheduleEval();
  } catch(e) { showErr('Errore nel parsing: ' + e.message); console.error(e); }
}

function askReset() {
  // se non c'è nulla caricato, azzera direttamente
  if (!allMoves.length && !fenData) { confirmReset(); return; }
  const ov = document.getElementById('overlay-confirm');
  ov.style.display = 'flex';
}
function confirmReset() {
  closeConfirm();
  resetAll();
}
function closeConfirm() {
  document.getElementById('overlay-confirm').style.display = 'none';
}

function resetAll() {
  allMoves = []; states = [makeInitBoard()]; curStep = 0; fenData = null;
  cancelEval(); cancelHint(); hint = null; setHintMsg(''); evalCache.clear();
  document.getElementById('eval-val').textContent = '—'; document.getElementById('effect-row').textContent = ''; document.getElementById('effect-row').className = '';
  document.getElementById('btn-hint').disabled = true; document.getElementById('turn-val').textContent = '—';
  document.getElementById('dbg').style.display = 'none';
  document.getElementById('pdn-input').value = '';
  document.getElementById('pdn-input').style.display = '';
  document.getElementById('pdn-display').style.display = 'none';
  document.getElementById('pdn-display').innerHTML = '';
  document.getElementById('slider').value = 0;
  document.getElementById('slider').max = 0;
  document.getElementById('no-game').style.display = '';
  document.getElementById('progress').textContent = '0 / 0';
  showErr('');
  drawBoard(makeInitBoard());
}

// ── Salvataggio e ripristino stato su localStorage ──────────────────────
function saveSession() {
  try {
    localStorage.setItem('di_pdn', getPDNText());
    localStorage.setItem('di_step', curStep);
    localStorage.setItem('di_loaded', allMoves.length > 0 || fenData ? '1' : '0');
  } catch(e) {}
}

function restoreSession() {
  try {
    const pdn = localStorage.getItem('di_pdn');
    const step = parseInt(localStorage.getItem('di_step') || '0', 10);
    const loaded = localStorage.getItem('di_loaded') === '1';
    if (!pdn) return;
    // Ripristina il testo nella textarea
    document.getElementById('pdn-input').value = pdn;
    if (loaded) {
      // Ricarica la partita
      loadPDN();
      // Ripristina la mossa corrente
      if (step > 0 && step <= allMoves.length) {
        curStep = step;
        updateUI();
        scheduleEval();
      }
    }
  } catch(e) {}
}

// Salva ad ogni cambio di mossa e ad ogni caricamento
const _origGoTo = goTo;
goTo = function(n) { _origGoTo(n); saveSession(); };

// Disegna la posizione iniziale dopo che il browser ha completato il layout
function initDraw() {
  resizeCanvas();
  restoreSession();
  if (!allMoves.length && !fenData) drawBoard(makeInitBoard());
}
// requestAnimationFrame garantisce che il canvas abbia dimensioni reali
if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', () => requestAnimationFrame(initDraw));
} else {
  requestAnimationFrame(initDraw);
}

// IntersectionObserver: ridisegna quando il canvas torna visibile dopo scroll
const observer = new IntersectionObserver((entries) => {
  entries.forEach(entry => {
    if (entry.isIntersecting) {
      const board = states.length ? states[curStep] : makeInitBoard();
      drawBoard(board);
    }
  });
}, {threshold: 0.1});
observer.observe(canvas);

// ── Mantieni schermo acceso: Wake Lock API con riacquisto periodico ───────
// Riacquista il wake lock ogni 25 secondi (alcuni dispositivi lo rilasciano
// automaticamente dopo 30 secondi di inattività)
let _wakeLock = null;
let _wakeLockTimer = null;

async function keepAwakeStart() {
  try {
    if ('wakeLock' in navigator) {
      if (_wakeLock) { try { _wakeLock.release(); } catch(e){} }
      _wakeLock = await navigator.wakeLock.request('screen');
    }
  } catch(e) {}
  clearInterval(_wakeLockTimer);
  _wakeLockTimer = setInterval(async () => {
    if (!document.hidden) {
      try {
        if ('wakeLock' in navigator) {
          if (_wakeLock) { try { _wakeLock.release(); } catch(e){} }
          _wakeLock = await navigator.wakeLock.request('screen');
        }
      } catch(e) {}
    }
  }, 5000);
}

function keepAwakeStop() {
  clearInterval(_wakeLockTimer);
  try { if (_wakeLock) { _wakeLock.release(); _wakeLock = null; } } catch(e) {}
}

document.addEventListener('visibilitychange', () => {
  if (document.hidden) { saveSession(); keepAwakeStop(); }
  else { resizeCanvas(); drawBoard(states.length ? states[curStep] : makeInitBoard()); keepAwakeStart(); }
});
window.addEventListener('pagehide', saveSession);

// Rinnova il wake lock ad ogni tocco sulla pagina
document.addEventListener('pointerdown', () => keepAwakeStart());
</script>
</body>
